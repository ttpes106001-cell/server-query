<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>警用車輛與人員資料查詢系統</title>
  <style>
    body { font-family: "Microsoft JhengHei", sans-serif; padding: 20px; background: #1a1e24; color: #e0e0e0; }
    .container { max-width: 1000px; margin: 0 auto; }
    h2 { color: #4da6ff; border-bottom: 2px solid #4da6ff; padding-bottom: 10px; }
    .search-box { margin-bottom: 20px; display: flex; gap: 10px; }
    input { padding: 12px; font-size: 16px; flex: 1; border: 1px solid #444; border-radius: 4px; background: #2a2e35; color: #fff; }
    button { padding: 12px 24px; font-size: 16px; background: #0066cc; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
    button:hover { background: #0052a3; }
    table { width: 100%; border-collapse: collapse; background: #242830; margin-top: 10px; display: none; }
    th, td { border: 1px solid #3a3f4d; padding: 12px; text-align: left; }
    th { background-color: #153e6b; color: #fff; }
    tr:nth-child(even) { background-color: #2d323e; }
    .status-msg { margin-top: 20px; font-size: 18px; color: #888; text-align: center; padding: 40px; border: 1px dashed #444; border-radius: 6px; }
  </style>
</head>
<body>

  <div class="container">
    <h2>🚓 警用車輛與人員資料查詢系統</h2>
    
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="請輸入 ID、Roblox 帳號、Discord 名稱或車牌..." onkeydown="if(event.key==='Enter') searchData()">
      <button onclick="searchData()">查詢</button>
    </div>

    <div id="statusMsg" class="status-msg">請輸入關鍵字並按下「查詢」或 Enter 開始搜尋資料。</div>

    <table id="resultTable">
      <thead><tr id="tableHeader"></tr></thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

  <script>
    const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vS-Ks0IDBy-7y1iZaEfTm9i8zjz16bywOG9cRo-GIzYkMoEYHZX05Scg0LxAT64JZ5gH92iMYARbLev/pub?gid=0&single=true&output=csv';
    let rawData = [];
    let headers = [];

    // 英文欄位轉中文對照表
    const headerTranslation = {
      'id': '編號',
      'roblox_name': 'Roblox 帳號',
      'dc_name': 'Discord 名稱',
      'vehicles': '擁有車輛',
      'plate_num': '車牌號碼',
      'is_wanted': '通緝狀態',
      'age': '年齡',
      'job': '職業',
      'has_license': '駕照狀態',
      'insurance': '保險狀態',
      'record': '前科紀錄',
      'image': '照片'
    };

    // 背景載入資料
    async function loadData() {
      try {
        const response = await fetch(SHEET_CSV_URL);
        const text = await response.text();
        const rows = text.split('\n').map(r => r.split(','));
        // 將英文表頭轉成中文，若不在對照表中則保留原樣
        headers = rows[0].map(h => {
          const cleanH = h.trim().toLowerCase();
          return headerTranslation[cleanH] || h.trim();
        });
        rawData = rows.slice(1);
      } catch (e) {
        document.getElementById('statusMsg').innerText = '❌ 資料庫連線失敗，請檢查網路狀態。';
      }
    }

    // 搜尋功能
    function searchData() {
      const q = document.getElementById('searchInput').value.trim().toLowerCase();
      const statusMsg = document.getElementById('statusMsg');
      const table = document.getElementById('resultTable');

      if (!q) {
        statusMsg.innerText = '⚠️ 請輸入搜尋關鍵字！';
        statusMsg.style.display = 'block';
        table.style.display = 'none';
        return;
      }

      // 過濾符合關鍵字的資料
      const filtered = rawData.filter(row => row.some(cell => cell && cell.toLowerCase().includes(q)));

      if (filtered.length === 0) {
        statusMsg.innerText = '🔍 查無相關人員或車輛資料。';
        statusMsg.style.display = 'block';
        table.style.display = 'none';
      } else {
        statusMsg.style.display = 'none';
        table.style.display = 'table';
        
        // 渲染表頭與內容
        document.getElementById('tableHeader').innerHTML = headers.map(h => `<th>${h}</th>`).join('');
        document.getElementById('tableBody').innerHTML = filtered.map(row => 
          `<tr>${row.map(cell => `<td>${cell || ''}</td>`).join('')}</tr>`
        ).join('');
      }
    }

    loadData();
  </script>
</body>
</html>
